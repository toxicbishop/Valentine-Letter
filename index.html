<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="Public/assets/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Pixelify+Sans:wght@400..700&display=swap"
    rel="stylesheet" />
  <title>Will you be my Valentine? ♡</title>
</head>

<body>
  <!-- Floating Hearts Container -->
  <div id="hearts-container"></div>

  <!-- Envelope Screen -->
  <div id="envelope-container">
    <img src="Public/assets/envelope.png" alt="Envelope" id="envelope" />
    <p>♡ Letter for You ♡</p>
  </div>

  <!-- Letter Screen -->
  <div id="letter-container">
    <div class="letter-window">
      <h1 id="letter-title">Will you be my Valentine?</h1>

      <img src="Public/assets/cat_heart.gif" class="cat" id="letter-cat" />

      <div class="buttons" id="letter-buttons">
        <img src="Public/assets/yes.png" class="btn yes-btn" alt="Yes" />

        <div class="maybe-wrapper">
          <button class="btn maybe-btn">Maybe</button>
        </div>

        <div class="no-wrapper">
          <img src="Public/assets/no.png" class="btn no-btn" alt="No" />
        </div>
      </div>

      <div id="cat-speech" class="speech-bubble" style="display: none;"></div>

      <p id="final-text" class="final-text" style="display: none">
        <strong>Valentine Date:</strong> Meow Restaurant at 7pm. Dress fancy!
      </p>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
